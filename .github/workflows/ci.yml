name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public release safety scan
        run: ./scripts/public-release-check.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install API dependencies
        run: python -m pip install -e 'apps/api[dev]'
      - name: Test
        run: pytest -q apps/api/tests
      - name: Lint
        run: ruff check apps/api
      - name: Type check
        run: mypy apps/api/src/research_lab

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Unit test
        working-directory: apps/web
        run: npm test -- --run
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Production build
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        working-directory: apps/web
        run: npx playwright test
